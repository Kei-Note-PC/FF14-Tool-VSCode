<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FF14 クレセントアイル：南征編 三日月島南部の銀箱（青箱）座標と取得チェック" />
    <title>クレセントアイル — 宝箱マップ（非公式）</title>
    <link rel="stylesheet" href="../javascript/styles.css" />
    <link rel="stylesheet" href="/Frontend/javascript/styles.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1 id="meta-title">クレセントアイル：南征編</h1>
        <p class="subtitle" id="meta-subtitle"></p>
        <div class="progress">
          <span id="progress-text"></span>
          <div class="progress__bar-wrap" aria-hidden="true">
            <div class="progress__bar" id="progress-bar"></div>
          </div>
          <button type="button" class="btn-reset" id="btn-reset">チェックをリセット</button>
        </div>
      </header>

      <div class="layout">
        <section class="panel" aria-labelledby="map-heading">
          <h2 id="map-heading">座標マップ</h2>
          <div class="overlay-toggles" aria-label="オーバーレイ表示切替">
            <label><input type="checkbox" id="toggle-silber" checked /> silber を表示</label>
            <label><input type="checkbox" id="toggle-bronz" checked /> bronze を表示</label>
            <label class="pin-size-label">
              アイコンサイズ
              <input type="range" id="pin-size-slider" min="8" max="32" value="22" step="1" />
              <span id="pin-size-value">22</span>px
            </label>
          </div>
          <p class="subtitle" style="margin: -0.25rem 0 0.75rem; font-size: 0.85rem">
            既定の場所は <code>../images/黄金/クレセントアイル/map.jpg</code>。無い場合は直下の <code>map.jpg</code> を試します。座標は x/y を 0–40 に正規化（北が上）。
          </p>
          <div id="map-root"></div>
        </section>

        <section class="panel" aria-labelledby="list-heading">
          <h2 id="list-heading">銀箱（青箱）一覧</h2>
          <div id="list-root"></div>
        </section>
      </div>

      <div class="note-box">
        <p id="copper-note"></p>
        <p id="disclaimer"></p>
      </div>

      <footer>
        FINAL FANTASY XIV © SQUARE ENIX CO., LTD. 本ツールは非公式のファン制作です。
      </footer>
    </div>
    <script src="../../app.js" defer></script>
  </body>
</html>
