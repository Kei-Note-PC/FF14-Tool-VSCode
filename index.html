<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FF14 の探索を支援する非公式ツール" />
    <title>FF14 Tools</title>
    <link rel="stylesheet" href="./Frontend/javascript/styles.css" />
  </head>
  <body class="home-body">
    <main class="home-shell">
      <header class="home-header">
        <p class="home-kicker">FINAL FANTASY XIV / FIELD NOTES</p>
        <h1>旅の記録を、<br /><span>すぐそばに。</span></h1>
        <p class="home-lead">エオルゼアの探索に役立つ情報を、見つけやすくまとめています。</p>
      </header>

      <section class="home-tools" aria-labelledby="tools-heading">
        <div class="home-section-heading">
          <p class="home-section-label">TOOLS</p>
          <h2 id="tools-heading">探索ツール</h2>
        </div>

        <div class="tool-grid">
          <a class="tool-card tool-card--featured" href="/Frontend/html/cresentail.html">
          <div class="tool-card__image" aria-hidden="true"></div>
          <div class="tool-card__body">
            <p class="tool-card__eyebrow">TREASURE MAP / 01</p>
            <h3>クレセントアイル</h3>
            <p>南征編の銀箱・青箱を、座標マップとチェックリストで確認できます。</p>
            <span class="tool-card__action">マップを開く <span aria-hidden="true">→</span></span>
          </div>
          </a>

          <a class="tool-card" href="/Frontend/html/zw.html">
            <div class="tool-card__image tool-card__image--zw" aria-hidden="true"></div>
            <div class="tool-card__body">
              <p class="tool-card__eyebrow">WEAPON QUEST / 02</p>
              <h3>ゾディアックウェポン</h3>
              <p>ZW製作に役立つ情報をまとめるページです。</p>
              <span class="tool-card__action">ZWページを開く <span aria-hidden="true">→</span></span>
            </div>
          </a>
        </div>
      </section>

      <footer class="home-footer">
        <span>FF14 Tools</span>
        <span>Unofficial fan project</span>
      </footer>
    </main>
  </body>
</html>
